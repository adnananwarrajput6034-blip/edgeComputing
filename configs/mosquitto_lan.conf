# Broker config for real-Pi runs: listen on ALL interfaces so Pis on the
# LAN can reach the laptop broker (the localhost-only config refuses them).
#
# SECURITY: anonymous access on a network-visible listener is acceptable
# only on a trusted private LAN (home/demo setting). The thesis design
# (docs/ARCHITECTURE.md "Security") calls for TLS + client certificates
# before any non-demo deployment.
#
# Usage:  /opt/homebrew/sbin/mosquitto -c configs/mosquitto_lan.conf -v

listener 1883 0.0.0.0
allow_anonymous true

# Same 32 MB packet limit as the localhost config — raw-audio batches
# are multi-MB.
max_packet_size 33554432
